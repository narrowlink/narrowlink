[package]
name = "narrowlink-token-generator"
version = "0.2.6"
description = 'Token generator for narrowlink'
readme = "README.md"
homepage = "https://narrowlink.com"
repository = "https://github.com/narrowlink/narrowlink"
license = 'MPL-2.0'
keywords = ["narrowlink"]
authors = ['Narrowlink <opensource@narrowlink.com>']
edition = "2021"

include = [
    "Cargo.toml",
    "LICENSE",
    "sample_token-generator.yaml",
    "src/**/*",
    "*help.arg",
]

[[bin]]
name = "narrowlink-token-generator"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
jsonwebtoken = { version = "10.4.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"], default-features = false }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
dirs = { version = "6.0.0", default-features = false }
clap_lex = { version = "0.7.7", default-features = false }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
thiserror = { version = "2.0.21", default-features = false }

narrowlink-types = { version = "0.2.6", default-features = false }

[package]
name = "narrowlink-gateway"
version = "0.2.6"
edition = "2021"
description = "Narrowlink Gateway"
readme = "README.md"
homepage = "https://narrowlink.com"
repository = "https://github.com/narrowlink/narrowlink/"
license = "AGPL-3.0"
keywords = ["narrowlink"]
authors = ['Narrowlink <opensource@narrowlink.com>']

include = [
    "Cargo.toml",
    "LICENSE",
    "sample_gateway.yaml",
    "src/**/*",
    "*help.arg",
    "templates/*.html",
]

[lints]
workspace = true

[dependencies]
bytes = "1"
tls-parser = "0.12"
tokio = { version = "1.54.1", features = ["full"] }
hyper = { version = "1.12", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tracing = { version = "0.1.44", default-features = false, features = [
    "attributes",
] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "ansi",
    "json",
] }
tracing-appender = { version = "0.2.5", default-features = false }
dirs = { version = "7.0.0", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
serde = { version = "1.0.229", features = ["derive"], default-features = false }
async-trait = { version = "0.1.92", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
pem = { version = "4.0.0", default-features = false, features = ["std"] }
uuid = { version = "1.29.0", default-features = false, features = [
    "v4",
    "serde",
] }
either = { version = "1.19.0", default-features = false }
instant-acme = { version = "0.8.5", default-features = false, features = [
    "hyper-rustls",
    "ring",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
validator = { version = "0.21.0", default-features = false, features = [
    "derive",
] }
rcgen = { version = "0.14.10", default-features = false, features = [
    "ring",
    "pem",
] }
x509-parser = { version = "0.18.1", default-features = false }
clap_lex = { version = "1.1.1", default-features = false }
sha3 = { version = "0.12.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false }

narrowlink-types = { version = "0.2.6" }
narrowlink-network = { version = "0.2.6" }

[package]
name = "narrowlink-types"
version = "0.2.6"
edition = "2021"
description = "Narrowlink Types Library"
homepage = "https://narrowlink.com"
repository = "https://github.com/narrowlink/narrowlink/"
license = 'MPL-2.0'
keywords = ["narrowlink"]
authors = ['Narrowlink <opensource@narrowlink.com>']

include = ["Cargo.toml", "LICENSE", "src/**/*"]

[lints]
workspace = true

[dependencies]
uuid = { version = "1.23.3", default-features = false, features = ["serde"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.150", default-features = false }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
ipnet = { version = "2.12.0", default-features = false, features = [
  "std",
  "serde",
] }
wildmatch = { version = "2.6.1" }
validator = { version = "0.20.0", default-features = false, features = [
  "derive",
] }
# regex = { version = "1.9.4", default-features = false }
regex-lite = { version = "0.1.9", default-features = false, features = [
  "std","string"
] }
hmac = { version = "0.13.0", default-features = false }
sha3 = { version = "0.12.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
thiserror = { version = "2.0.18", default-features = false }

[package]
name = "narrowlink-agent"
version = "0.2.6"
description = 'Narrowlink Agent'
readme = "README.md"
homepage = "https://narrowlink.com"
repository = "https://github.com/narrowlink/narrowlink/"
license = 'MPL-2.0'
keywords = ["narrowlink"]
authors = ['Narrowlink <opensource@narrowlink.com>']
edition = "2021"

include = [
  "Cargo.toml",
  "LICENSE",
  "sample_agent.yaml",
  "src/**/*",
  "*help.arg",
]

[lints]
workspace = true

[dependencies]
tokio = { version = "1.54.1", default-features = false, features = [
  "macros",
  "rt",
  "time",
  "rt-multi-thread",
] }
futures-util = { version = "0.3.34", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false }
serde_yaml = { version = "0.9.34", default-features = false }
uuid = { version = "1.29.0", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
futures-channel = { version = "0.3.34", features = [
  "sink",
], default-features = false }
udp-stream = { version = "0.0.12", default-features = false }
sha3 = { version = "0.10.9", default-features = false }
hmac = { version = "0.12.1", default-features = false }
dirs = { version = "6.0.0", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = [
  "attributes",
] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "ansi",
  "json",
] }
tracing-appender = { version = "0.2.5", default-features = false }
clap_lex = { version = "0.7.7", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
# base64 = { version = "0.21.0", default-features = false }

narrowlink-types = { version = "0.2.6", default-features = false }
narrowlink-network = { version = "0.2.6", default-features = false }

[target.'cfg(unix)'.dependencies]
cf-daemonize = { version = "0.3.0", default-features = false }

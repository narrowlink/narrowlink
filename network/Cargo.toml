[package]
name = "narrowlink-network"
version = "0.2.6"
edition = "2021"
description = "Narrowlink Network Library"
homepage = "https://narrowlink.com"
repository = "https://github.com/narrowlink/narrowlink/"
license = 'MPL-2.0'
keywords = ["narrowlink"]
authors = ['Narrowlink <opensource@narrowlink.com>']

include = ["Cargo.toml", "LICENSE", "src/**/*"]

[lints]
workspace = true

[dependencies]
bytes = { version = "1.11.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = { version = "1.0.150", default-features = false, features = [
    "alloc",
] }
futures-util = { version = "0.3.32", default-features = false }
tokio = { version = "1.52.3", features = [
    "macros",
    "rt",
    "net",
    "rt-multi-thread",
], default-features = false }
tokio-util = { version = "0.7", features = ["codec"], default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
rustls-platform-verifier = { version = "0.7", default-features = false }
hyper = { version = "1.10.1", features = ["full"], default-features = false }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.3"
tokio-tungstenite = { version = "0.29.0", default-features = false }
tungstenite = { version = "0.29.0", features = [
    "handshake",
], default-features = false }
chacha20poly1305 = { version = "0.10.1", features = [
    "alloc",
], default-features = false }
quinn = { version = "0.11.9", default-features = false, features = [
    "runtime-tokio",
    "rustls",
] }
async-recursion = { version = "1.1.1", default-features = false }
tracing = { version = "0.1.44", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
chunkio = { version = "0.0.1", default-features = false }

narrowlink-types = { version = "0.2.6", default-features = false }


[target.'cfg(unix)'.dependencies]
rlimit = { version = "0.11.0", default-features = false }


[features]
agent = []
client = []

[package]
name = "narrowlink-network"
version = "0.2.6"
edition = "2021"
description = "Narrowlink Network Library"
homepage = "https://narrowlink.com"
repository = "https://github.com/narrowlink/narrowlink/"
license = 'MPL-2.0'
keywords = ["narrowlink"]
authors = ['Narrowlink <opensource@narrowlink.com>']

include = ["Cargo.toml", "LICENSE", "src/**/*"]

[lints]
workspace = true

[dependencies]
bytes = { version = "1.12.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"], default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = [
    "alloc",
] }
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.54.1", features = [
    "macros",
    "rt",
    "net",
    "rt-multi-thread",
], default-features = false }
tokio-util = { version = "0.7", features = ["codec"], default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23.46", features = ["ring", "std", "tls12"], default-features = false }
rustls-platform-verifier = { version = "0.7", default-features = false }
hyper = { version = "1.8", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.20.1", default-features = false }
tungstenite = { version = "0.20.1", features = [
    "handshake",
], default-features = false }
chacha20poly1305 = { version = "0.10.1", features = [
    "alloc",
], default-features = false }
quinn = { version = "0.11.12", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
async-recursion = { version = "1.2.0", default-features = false }
tracing = { version = "0.1.44", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
chunkio = { version = "0.0.1", default-features = false }

narrowlink-types = { version = "0.2.6", default-features = false }


[target.'cfg(unix)'.dependencies]
rlimit = { version = "0.11.0", default-features = false }


[features]
agent = []
client = []

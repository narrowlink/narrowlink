name: CI

on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Run cargo check
        run: cargo +stable build --all-features --all-targets --verbose
      - name: Run cargo test
        run: cargo +stable test --all-features --all-targets --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install latest stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
        if: always()
